<!doctype html>
<html lang="zh-CN" data-theme="aurora">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>前沿雷达 · Frontier Radar</title>
    <script src="./js/theme-boot.js"></script>
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/liquid-glass.css" />
    <link rel="stylesheet" href="./styles/app.css" />
  </head>
  <body>
    <div class="lg-root lg-app" id="app">
      <div class="lg-ambient"></div>
      <div class="app-grid" aria-hidden="true"></div>

      <header class="lg-toolbar app-titlebar" id="titlebar">
        <div class="lg-toolbar-inner">
          <div class="lg-brand" title="前沿雷达 Frontier Radar">
            <div class="lg-brand-icon">
              <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
                <defs>
                  <linearGradient id="brandGrad" x1="4" y1="4" x2="28" y2="28">
                    <stop offset="0" stop-color="var(--accent-primary)" />
                    <stop offset="1" stop-color="var(--accent-secondary)" />
                  </linearGradient>
                </defs>
                <circle cx="16" cy="16" r="11.5" stroke="url(#brandGrad)" stroke-width="1.5" opacity=".45" />
                <circle cx="16" cy="16" r="6.5" stroke="url(#brandGrad)" stroke-width="1.6" opacity=".8" />
                <path
                  d="M16 4.5v3.2M16 24.3v3.2M4.5 16h3.2M24.3 16h3.2"
                  stroke="url(#brandGrad)"
                  stroke-width="1.5"
                  stroke-linecap="round"
                />
                <path d="M16 16 23.6 8.4" stroke="url(#brandGrad)" stroke-width="2.2" stroke-linecap="round" />
                <circle cx="16" cy="16" r="2.1" fill="url(#brandGrad)" />
              </svg>
            </div>
            <div class="lg-brand-name"><span class="lg-brand-name-text">前沿雷达</span></div>
          </div>

          <div class="app-toolbar-title" id="toolbar-title">概览</div>
          <div class="app-toolbar-spacer"></div>

          <label class="app-search" for="search">
            <span class="app-search-icon" id="search-icon"></span>
            <input
              id="search"
              class="app-search-input"
              type="search"
              placeholder="搜索标题、摘要、标签…"
              autocomplete="off"
              spellcheck="false"
              aria-label="搜索资讯"
            />
            <kbd class="app-search-kbd">Ctrl K</kbd>
            <button class="app-search-clear" id="search-clear" type="button" hidden aria-label="清除搜索">
              <span id="search-clear-icon"></span>
            </button>
          </label>

          <div class="lg-cluster app-tool-cluster">
            <button class="lg-icon-btn" id="refresh-btn" type="button" title="刷新资讯 (R)" aria-label="刷新资讯">
              <span class="lg-icon" id="refresh-icon"></span>
            </button>
            <button class="lg-icon-btn" id="theme-btn" type="button" title="切换主题" aria-label="切换主题">
              <span class="lg-icon" id="theme-icon"></span>
            </button>
            <button class="lg-icon-btn" id="settings-btn" type="button" title="设置" aria-label="设置">
              <span class="lg-icon" id="settings-icon"></span>
            </button>
          </div>

          <div class="lg-window-controls">
            <button class="lg-window-btn" type="button" data-win="minimize" title="最小化" aria-label="最小化">
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M4 8h8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
              </svg>
            </button>
            <button class="lg-window-btn" type="button" data-win="maximize" title="最大化" aria-label="最大化" id="max-btn">
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <rect x="4.5" y="4.5" width="7" height="7" rx="1.2" stroke="currentColor" stroke-width="1.3" />
              </svg>
            </button>
            <button class="lg-window-btn is-close" type="button" data-win="close" title="关闭" aria-label="关闭">
              <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M5 5l6 6M11 5l-6 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
              </svg>
            </button>
          </div>
        </div>
      </header>

      <div class="lg-content app-body">
        <aside class="lg-sidebar app-sidebar" id="sidebar" aria-label="导航"></aside>
        <main class="lg-main app-main lg-scroll" id="main" tabindex="-1"></main>
        <div class="lg-resizer split-resizer" id="split-resizer" hidden aria-hidden="true"></div>
        <div class="split-reader" id="reader-split" hidden></div>
      </div>

      <div id="overlay-root"></div>
      <div id="toast-root" class="app-toast-root" aria-live="polite"></div>
    </div>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
